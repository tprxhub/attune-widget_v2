version: 1
applications:
  - appRoot: Playhub_APP/PlayHub_FE
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g bun
            - bun install --frozen-lockfile
        build:
          commands:
            - bun run build
            - node scripts/amplify-cache-headers.mjs
      artifacts:
        baseDirectory: .amplify-hosting
        files:
          - '**/*'
